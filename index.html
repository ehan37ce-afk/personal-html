<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoloTrip · 旅行方式研究</title>
<style>
:root{--ink:#171717;--muted:#777;--paper:#f7f5ef;--card:#fff;--line:#e6e2d9;--accent:#111}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}.shell{max-width:980px;margin:auto;padding:28px 22px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:80px}.logo{font-weight:800;letter-spacing:-.04em;font-size:22px}.tag{font-size:12px;border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#fff}.hero{max-width:720px;margin:0 auto 54px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:18px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.065em;margin:0 0 24px}.hero p{font-size:18px;line-height:1.65;color:#555;max-width:650px}.intro{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.pill{padding:9px 13px;background:#ece9e0;border-radius:999px;font-size:13px}.progress{height:4px;background:#dedbd3;border-radius:9px;margin:0 auto 28px;max-width:720px;overflow:hidden}.bar{height:100%;background:#111;width:0;transition:.35s}.card{max-width:720px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:clamp(25px,5vw,48px);box-shadow:0 18px 55px rgba(30,27,20,.06)}.meta{font-size:12px;color:var(--muted);margin-bottom:16px}.q{font-size:28px;line-height:1.25;letter-spacing:-.035em;margin:0 0 10px}.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 28px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);border-radius:16px;padding:16px 17px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.18s;background:#fff}.option:hover{border-color:#999;transform:translateY(-1px)}.option.selected{border-color:#111;background:#f4f2ec}.option input{margin-top:4px;accent-color:#111}.textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:16px;padding:16px;resize:vertical;outline:none}.textarea:focus{border-color:#111}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:30px;gap:12px}.btn{border:0;border-radius:999px;padding:13px 22px;cursor:pointer}.back{background:#eeeae1}.next{background:#111;color:#fff}.next:disabled{opacity:.35;cursor:not-allowed}.privacy{font-size:11px;color:#999;line-height:1.5;margin-top:18px}.success{text-align:center;padding:35px 0}.success .mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#111;color:#fff;margin:0 auto 25px;font-size:25px}.success h2{font-size:38px;letter-spacing:-.05em;margin:0 0 14px}.success p{color:#666;line-height:1.6}.footer{max-width:720px;margin:22px auto 0;color:#999;font-size:11px;text-align:center}@media(max-width:600px){.top{margin-bottom:52px}.card{border-radius:20px}.q{font-size:24px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div class="shell"><div class="top"><div class="logo">SoloTrip<span style="font-weight:400">/research</span></div><div class="tag">约 3 分钟</div></div>
<section class="hero" id="hero"><div class="eyebrow">Help shape SoloTrip</div><h1>一个人出发，<br>也可以有搭子。</h1><p>我们正在研究人们对 Solo 旅行与旅行搭子的真实期待。你的回答会帮助我们设计一个更自由、更合拍，也更让人安心的旅行体验。</p><div class="intro"><span class="pill">Solo / Buddy</span><span class="pill">匹配偏好</span><span class="pill">安全与信任</span></div></section>
<div class="progress"><div class="bar" id="bar"></div></div><main class="card" id="app"></main><div class="footer">匿名研究 · 不收集敏感身份信息 · 你的回答仅用于 SoloTrip 产品研究</div></div>
<script>
const questions=[
{id:'mode',q:'如果下一次旅行由你决定，你更倾向于？',type:'single',opts:['完全 Solo，一个人说走就走','Solo 出发，但希望途中认识搭子','更愿意和匹配到的搭子一起旅行','看目的地和行程，两种方式都可以']},
{id:'motivation',q:'你最期待 SoloTrip 帮你解决什么？',type:'multi',opts:['找到兴趣相投的旅行搭子','一个人旅行时减少孤独感','找到更合拍的同行节奏','获得目的地攻略与灵感','提升独自旅行的安全感','临时组队完成某段行程或活动']},
{id:'match',q:'如果要匹配旅行搭子，你最希望系统优先考虑哪些？',hint:'最多选择 4 项',type:'multi',max:4,opts:['兴趣 / 爱好','旅行节奏','目的地与行程重合度','预算','性格','年龄区间','住宿偏好','作息与生活习惯']},
{id:'concern',q:'想到和陌生人一起旅行，你最担心什么？',type:'multi',opts:['身份真实性','人身安全','对方临时爽约','性格或旅行节奏不合','费用 / 消费纠纷','隐私泄露','沟通困难','暂时没有明显担忧']},
{id:'trust',q:'什么会让你更愿意相信一个陌生旅行搭子？',hint:'最多选择 4 项',type:'multi',max:4,opts:['实名认证 / 身份验证','社交账号或真实经历验证','平台安全评分','共同好友 / 熟人背书','视频或语音见面确认','完整的旅行档案','平台提供紧急联系人 / SOS','明确的双方安全确认流程']},
{id:'confirm',q:'如果正式匹配前，需要双方完成一次“安全确认”，你的接受程度是？',type:'single',opts:['非常愿意，这会让我更安心','比较愿意，但希望流程很简单','可以接受，但不希望透露太多个人信息','不太需要，我更看重自由和效率','完全不愿意']},
{id:'information',q:'在决定是否与一个搭子同行前，你最想提前看到什么？',type:'multi',opts:['旅行经历','兴趣与性格','旅行节奏','预算范围','公开社交资料','身份认证状态','其他用户评价','彼此重合的行程']},
{id:'barrier',q:'什么情况下，即使很想找搭子，你仍然可能放弃？',type:'single',opts:['匹配不到合适的人','安全机制不够让我放心','需要填写太多个人信息','匹配流程太复杂 / 太慢','担心旅行中发生费用纠纷','我其实更喜欢一个人旅行']},
{id:'value',q:'如果 SoloTrip 只能做好一件事，你最希望它是什么？',type:'text',placeholder:'例如：帮我找到真正合拍、可以放心一起旅行的人……'},
{id:'final',q:'还有什么是你希望 SoloTrip 提前知道的？',hint:'任何期待、担忧或建议都可以告诉我们',type:'text',placeholder:'写下你的想法……'}
];
let i=-1;const answers={};const app=document.getElementById('app');const bar=document.getElementById('bar');
function render(){if(i<0){app.innerHTML='<div class="success"><div class="mark">✓</div><h2>Ready when you are.</h2><p>点击开始，用约 3 分钟告诉我们：<br>什么会让一次旅行既自由，又值得信任。</p><div class="actions"><span></span><button class="btn next" onclick="start()">开始问卷 →</button></div></div>';bar.style.width='0%';return}if(i>=questions.length){submit();return}const x=questions[i];bar.style.width=((i+1)/questions.length*100)+'%';let body='';if(x.type==='text')body=`<textarea id="text" class="textarea" placeholder="${x.placeholder||''}">${answers[x.id]||''}</textarea>`;else body=`<div class="options">${x.opts.map((o,n)=>{const selected=(answers[x.id]||[]).includes(o)||answers[x.id]===o;return `<label class="option ${selected?'selected':''}"><input type="${x.type==='multi'?'checkbox':'radio'}" name="answer" value="${o.replaceAll('"','&quot;')}" ${selected?'checked':''} onchange="pick(this)"><span>${o}</span></label>`}).join('')}</div>`;app.innerHTML=`<div class="meta">${String(i+1).padStart(2,'0')} / ${String(questions.length).padStart(2,'0')}</div><h2 class="q">${x.q}</h2>${x.hint?`<p class="hint">${x.hint}</p>`:''}${body}<div class="actions"><button class="btn back" onclick="back()" ${i===0?'style="visibility:hidden"':''}>← 上一题</button><button class="btn next" onclick="next()">${i===questions.length-1?'提交回答':'下一题 →'}</button></div><div class="privacy">你的回答将用于 SoloTrip 用户研究。请不要填写身份证号、住址、电话等敏感个人信息。</div>`}
function start(){i=0;render()}function pick(el){const x=questions[i];if(x.type==='multi'){let a=[...document.querySelectorAll('input[name=answer]:checked')].map(e=>e.value);if(x.max&&a.length>x.max){el.checked=false;return}answers[x.id]=a}else answers[x.id]=el.value;renderSelection()}
function renderSelection(){document.querySelectorAll('.option').forEach(e=>e.classList.toggle('selected',e.querySelector('input').checked))}
function next(){const x=questions[i];if(x.type==='text'){answers[x.id]=document.getElementById('text').value.trim()}if((x.type==='single'||x.type==='multi')&&!answers[x.id]?.length){alert('请选择一个答案后继续');return}i++;render()}function back(){if(i>0){i--;render()}}
async function submit(){app.innerHTML='<div class="success"><div class="mark">…</div><h2>正在提交</h2><p>请稍等，我们正在保存你的回答。</p></div>';const payload={submittedAt:new Date().toISOString(),source:location.href,answers};try{const endpoint=window.SOLOTRIP_ENDPOINT||'';if(!endpoint)throw new Error('endpoint-not-configured');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error('submit-failed');showDone()}catch(e){console.warn(e);localStorage.setItem('solotrip_response',JSON.stringify(payload));showDone(true)}}
function showDone(local){app.innerHTML=`<div class="success"><div class="mark">✓</div><h2>感谢你的回答。</h2><p>${local?'回答已保存在当前设备，后台接口配置完成后即可自动汇总。':'你的回答已经安全提交。'}<br>你的反馈会帮助 SoloTrip 设计更值得信任的旅行搭子体验。</p></div>`;bar.style.width='100%'}
render();
</script>
</body></html>
