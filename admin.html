<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoloTrip Research Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f6f4ee;--card:#fff;--ink:#171717;--muted:#777;--line:#e7e3da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:30px 22px 60px}.login{max-width:440px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px}.brand{font-size:23px;font-weight:800;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin-top:7px}.login h1{font-size:34px;letter-spacing:-.05em;margin:42px 0 8px}.login p{color:var(--muted);font-size:14px;line-height:1.5}.field{margin:16px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;outline:none}.field input:focus{border-color:#111}.primary{width:100%;border:0;background:#111;color:#fff;border-radius:999px;padding:13px;cursor:pointer}.error{color:#b42318;font-size:13px;margin:12px 0}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:38px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.hero{margin-bottom:25px}.hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:-.06em;line-height:1;margin:0 0 10px}.hero p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px}.stat label{display:block;color:var(--muted);font-size:12px;margin-bottom:12px}.num{font-size:34px;font-weight:750;letter-spacing:-.05em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel h2{font-size:18px;margin:0 0 18px;letter-spacing:-.03em}.wide{grid-column:1/-1}.barrow{margin:13px 0}.barhead{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}.track{height:8px;background:#eeeae2;border-radius:9px;overflow:hidden}.fill{height:100%;background:#171717;border-radius:9px}.comments{display:grid;gap:10px}.comment{border:1px solid var(--line);border-radius:14px;padding:14px;color:#444;font-size:14px;line-height:1.55;background:#fcfbf8}.empty{color:#999;padding:30px 0;text-align:center}.loading{padding:60px;text-align:center;color:#777}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{gap:15px;flex-direction:column}.actions{width:100%}}
</style></head><body><div id="login" class="login"><div class="brand">SoloTrip / research</div><div class="sub">Research Dashboard · 管理员入口</div><h1>Welcome back.</h1><p>登录后查看受访者问卷、统计数据和用户原声。</p><form onsubmit="login(event)"><div class="field"><label>邮箱</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="error"></div><button class="primary" type="submit">登录 Dashboard →</button></form></div><div id="app" class="wrap" style="display:none"><header class="head"><div><div class="brand">SoloTrip / research</div><div class="sub">用户研究数据看板 · 搭子匹配与安全确认</div></div><div class="actions"><button class="btn" onclick="loadData()">↻ 刷新</button><button class="btn" onclick="exportCSV()">↓ 导出 CSV</button><button class="btn" onclick="logout()">退出登录</button></div></header><section class="hero"><h1>Research Dashboard</h1><p>实时查看问卷反馈，快速验证 SoloTrip 的核心产品假设。</p></section><div id="loading" class="loading">正在加载研究数据…</div><div id="dashboard" style="display:none"><div class="stats"><div class="stat"><label>总回答人数</label><div class="num" id="total">0</div></div><div class="stat"><label>安全确认：非常/比较愿意</label><div class="num" id="trustRate">0%</div></div><div class="stat"><label>最关注：安全相关</label><div class="num" id="safety">0%</div></div><div class="stat"><label>数据更新时间</label><div class="num" style="font-size:17px" id="updated">—</div></div></div><div class="grid"><section class="panel"><h2>旅行方式偏好</h2><div id="mode"></div></section><section class="panel"><h2>最期待 SoloTrip 解决什么</h2><div id="motivation"></div></section><section class="panel"><h2>最大的搭子顾虑</h2><div id="concern"></div></section><section class="panel"><h2>什么最能建立信任</h2><div id="trust"></div></section><section class="panel wide"><h2>匹配时最想看到的信息</h2><div id="information"></div></section><section class="panel wide"><h2>开放式回答 · 用户原声</h2><div id="comments" class="comments"></div></section></div></div></div><script>
const SUPABASE_URL='https://tuyatnryscxxplncutpj.supabase.co';const SUPABASE_KEY='sb_publishable_PGLzBPq8Q1RJ-DyEy0-G6Q_cpmjSLaE';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let rows=[];
async function init(){const {data:{session}}=await db.auth.getSession();if(session){showApp()}else{document.getElementById('login').style.display='block'}}
async function login(e){e.preventDefault();const err=document.getElementById('loginError');err.textContent='';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {error}=await db.auth.signInWithPassword({email,password});if(error){err.textContent='登录失败：'+error.message;return}showApp()}
async function logout(){await db.auth.signOut();location.reload()}
function showApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';loadData()}
function count(id){const m={};rows.forEach(r=>{let a=r.answers?.[id];if(!Array.isArray(a))a=a?[a]:[];a.forEach(v=>m[v]=(m[v]||0)+1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function renderBars(id,data){const el=document.getElementById(id);if(!data.length){el.innerHTML='<div class="empty">暂无数据</div>';return}const max=Math.max(...data.map(x=>x[1]));el.innerHTML=data.map(([k,v])=>`<div class="barrow"><div class="barhead"><span>${escapeHtml(k)}</span><strong>${v} · ${rows.length?Math.round(v/rows.length*100):0}%</strong></div><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function loadData(){document.getElementById('loading').style.display='block';document.getElementById('dashboard').style.display='none';const {data,error}=await db.from('responses').select('id,created_at,answers,source,submitted_at').order('created_at',{ascending:false});if(error){document.getElementById('loading').innerHTML='<b>无法读取数据</b><br><br>请确认已为管理员登录用户创建 SELECT RLS policy。<br><small>'+escapeHtml(error.message)+'</small>';return}rows=data||[];document.getElementById('loading').style.display='none';document.getElementById('dashboard').style.display='block';document.getElementById('total').textContent=rows.length;const c=rows.filter(r=>['非常愿意，这会让我更安心','比较愿意，但希望流程很简单'].includes(r.answers?.confirm)).length;document.getElementById('trustRate').textContent=rows.length?Math.round(c/rows.length*100)+'%':'0%';const s=rows.filter(r=>JSON.stringify(r.answers?.concern||[]).match(/安全|人身|身份/)).length;document.getElementById('safety').textContent=rows.length?Math.round(s/rows.length*100)+'%':'0%';document.getElementById('updated').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});renderBars('mode',count('mode'));renderBars('motivation',count('motivation'));renderBars('concern',count('concern'));renderBars('trust',count('trust'));renderBars('information',count('information'));const cs=rows.map(r=>[r.answers?.value,r.answers?.final]).flat().filter(Boolean);document.getElementById('comments').innerHTML=cs.length?cs.map(x=>`<div class="comment">“${escapeHtml(x)}”</div>`).join(''):'<div class="empty">暂无开放式回答</div>'}
function exportCSV(){if(!rows.length){alert('暂无数据可导出');return}const headers=['id','created_at','submitted_at','source','answers'];const csv=[headers.join(','),...rows.map(r=>headers.map(h=>`"${String(h==='answers'?JSON.stringify(r[h]||{}):r[h]??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='solotrip-research-'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
db.auth.onAuthStateChange((_event,session)=>{if(session)showApp()});init();
</script></body></html>
